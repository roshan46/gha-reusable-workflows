name: Reusable Node quality
on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '24.14.0'
    outputs:
      revision:
        description: Tested source revision
        value: ${{ jobs.test.outputs.revision }}
permissions: {}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.meta.outputs.revision }}
    steps:

      - name: Shared workflow update test
        run: echo "Shared quality workflow is active"


      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - id: meta
        env:
          REVISION: ${{ github.sha }}
        run: echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: node-coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: warn
